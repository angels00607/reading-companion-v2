name: Deploy Reading Companion Web
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'v3/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Run StoryGraph regression tests
        working-directory: web
        run: npm test
      - name: Build web app
        working-directory: web
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_SUPABASE_URL: https://skenuigulnonrshkwelu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fch6NSx050hyF61mInrQPQ_hzlWW1-_
        run: npm run build
      - name: Preserve existing V2 output
        run: mv web/dist web/dist-v2
      - name: Build isolated V3 from the same source
        working-directory: web
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_SUPABASE_URL: https://qpkliwzcfhyyifmvuygh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LrCG-sz30gDrAlPX_txa5g_pAM7HsLM
        run: npm run build -- --base=/reading-companion-v2/v3/
      - name: Combine V2 and V3 without overwriting V2
        run: |
          mv web/dist web/dist-v3
          mv web/dist-v2 web/dist
          mv web/dist-v3 web/dist/v3
      - name: Prepare GitHub Pages output
        run: |
          touch web/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
